ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.vidoora.backend.ApplicationKt.module ]
    }
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "https://vidoora.app"
    audience = "https://vidoora.app/api"
    realm = "Vidoora API Access"
    accessLifetimeMs = 900000 // 15 minutes
    refreshLifetimeMs = 2592000000 // 30 days
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/vidoora_db"
    jdbcUrl = ${?DATABASE_URL}
    driverClassName = "org.postgresql.Driver"
    username = "postgres"
    username = ${?DB_USERNAME}
    password = ${DB_PASSWORD}
    maximumPoolSize = 10
    allowInMemoryFallback = false
}

r2 {
    mockMode = false
    mockMode = ${?R2_MOCK_MODE}
    accountId = "mock-r2-account-id"
    accountId = ${?R2_ACCOUNT_ID}
    accessKeyId = "mock-r2-access-key"
    accessKeyId = ${?R2_ACCESS_KEY_ID}
    secretAccessKey = "mock-r2-secret-key"
    secretAccessKey = ${?R2_SECRET_ACCESS_KEY}
    rawBucketName = "vidoora-raw-uploads"
    rawBucketName = ${?R2_RAW_BUCKET_NAME}
    processedBucketName = "vidoora-processed-hls"
    processedBucketName = ${?R2_PROCESSED_BUCKET_NAME}
    endpoint = "https://mock-r2-account-id.r2.cloudflarestorage.com"
    endpoint = ${?R2_ENDPOINT}
}


# Verified membership and separately opted-in durable receipt recovery. Checkout remains unavailable.
membership {
    internalTestCheckoutEnabled = false
    internalTestCheckoutEnabled = ${?PLAY_INTERNAL_TEST_CHECKOUT_ENABLED}
    recoveryEnabled = false
    recoveryEnabled = ${?PLAY_PURCHASE_RECOVERY_ENABLED}
    verifiedReadEnabled = false
    verifiedReadEnabled = ${?PLAY_MEMBERSHIP_READ_ENABLED}
    credentialsFile = ${?PLAY_CREDENTIALS_FILE}
    receiptKey = ${?PLAY_RECEIPT_KEY}
    productId = ${?PLAY_PRODUCT_ID}
    dayBasePlan = ${?PLAY_DAY_BASE_PLAN}
    weekBasePlan = ${?PLAY_WEEK_BASE_PLAN}
    monthlyBasePlan = ${?PLAY_MONTHLY_BASE_PLAN}
    allowTestPurchases = false
    allowTestPurchases = ${?PLAY_ALLOW_TEST_PURCHASES}
}
